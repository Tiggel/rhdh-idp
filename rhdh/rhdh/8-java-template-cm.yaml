---
apiVersion: v1
kind: ConfigMap
metadata:
  name: java-service-template
  namespace: demo-project
data:
  template.yaml: |
    apiVersion: scaffolder.backstage.io/v1beta3
    kind: Template
    metadata:
      name: java-service
      title: Java Spring Boot Service
      description: Scaffold a new Java Spring Boot microservice on GitLab
      tags:
        - java
        - spring-boot
        - gitlab
    spec:
      owner: user:default/guest
      type: service
      parameters:
        - title: Service Information
          required:
            - name
            - description
            - owner
          properties:
            name:
              title: Name
              type: string
              description: Unique name of the service (used as GitLab repo name)
              ui:autofocus: true
              ui:field: EntityNamePicker
            description:
              title: Description
              type: string
              description: Short description of the service
            owner:
              title: Owner
              type: string
              description: Owner group or user
              ui:field: OwnerPicker
              ui:options:
                catalogFilter:
                  kind: [Group, User]
        - title: Java Configuration
          required:
            - groupId
            - artifactId
            - javaPackage
          properties:
            groupId:
              title: Maven Group ID
              type: string
              default: com.example
            artifactId:
              title: Maven Artifact ID
              type: string
              description: Defaults to the service name if left blank
            javaPackage:
              title: Base Java Package
              type: string
              default: com.example.service
              description: e.g. com.acme.payments
        - title: GitLab Repository
          required:
            - gitlabGroup
          properties:
            gitlabGroup:
              title: GitLab Group / Namespace
              type: string
              description: GitLab group or username where the repo will be created
      steps:
        - id: fetch-base
          name: Fetch Skeleton
          action: fetch:template
          input:
            url: https://github.com/Tiggel/rhdh-idp/tree/phase-1-work/templates/java-service/skeleton
            values:
              name: ${{ parameters.name }}
              description: ${{ parameters.description }}
              groupId: ${{ parameters.groupId }}
              artifactId: ${{ parameters.artifactId | default(parameters.name) }}
              javaPackage: ${{ parameters.javaPackage }}
              owner: ${{ parameters.owner }}
              gitlabGroup: ${{ parameters.gitlabGroup }}
              gitlabHost: gitlab.consol.de
        - id: publish
          name: Publish to GitLab
          action: publish:gitlab
          input:
            allowedHosts:
              - gitlab.consol.de
            description: ${{ parameters.description }}
            repoUrl: gitlab.consol.de?owner=${{ parameters.gitlabGroup }}&repo=${{ parameters.name }}
            defaultBranch: main
            repoVisibility: internal
        - id: register
          name: Register in Catalog
          action: catalog:register
          input:
            repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
            catalogInfoPath: /catalog-info.yaml
      output:
        links:
          - title: Repository
            url: ${{ steps['publish'].output.remoteUrl }}
          - title: Open in catalog
            icon: catalog
            entityRef: ${{ steps['register'].output.entityRef }}
